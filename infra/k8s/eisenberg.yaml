# Three workloads. Create the secret from the environment before applying:
#   kubectl create secret generic eisenberg --from-env-file=.env
# The secret must contain DATABASE_URL, RABBITMQ_URL, and the service keys that are set.
# It must contain PUBLIC_API_URL and WEB_ORIGIN. Do not set DEVELOPMENT_AUTH.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: eisenberg-api:latest
          ports:
            - containerPort: 5000
          env:
            - name: ASPNETCORE_URLS
              value: http://+:5000
            - name: DEVELOPMENT_AUTH
              value: "false"
          envFrom:
            - secretRef:
                name: eisenberg
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: eisenberg-worker:latest
          env:
            - name: ASPNETCORE_URLS
              value: http://+:5001
          envFrom:
            - secretRef:
                name: eisenberg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: eisenberg-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: API_BASE_URL
              value: http://api:5000
            - name: PUBLIC_API_URL
              valueFrom:
                secretKeyRef:
                  name: eisenberg
                  key: PUBLIC_API_URL
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
