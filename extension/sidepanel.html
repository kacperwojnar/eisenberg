<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>eisenberg</title>
    <style>
      body { font-family: Georgia, serif; margin: 0; }
      main { display: flex; flex-direction: column; height: 100vh; }
      #records { flex: 1; overflow: auto; padding: 0.75rem; }
      button.record { display: block; width: 100%; text-align: left; margin: 0 0 0.4rem; font: inherit; }
      button.record[aria-pressed="true"] { outline: 2px solid #333; }
      .note { color: #555; font-size: 0.85rem; padding: 0.75rem 0.75rem 0; }
      #status { white-space: pre-wrap; }
      footer { padding: 0.75rem; border-top: 1px solid #ddd; }
    </style>
  </head>
  <body>
    <main>
      <p class="note">Choose a record. It is entered into the open tab.</p>
      <div id="records"></div>
      <p class="note" id="status"></p>
      <footer>
        <button id="fill" type="button" disabled>Fill this page</button>
      </footer>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
